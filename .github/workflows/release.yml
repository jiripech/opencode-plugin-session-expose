name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" \
            '$0 == "## [" ver "]" {flag=1; next} flag && /^## \[/{exit} flag' \
            CHANGELOG.md)
          if [ -n "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

      - name: Publish to npm
        run: npm stage publish --access public --//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
